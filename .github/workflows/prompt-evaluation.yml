name: Repository harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-evaluation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run git:check
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:transport
  agent-lint-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Advisory while CLI extensions and client-version diagnostics are calibrated.
      - run: npm run lint:agents -- --ignore-inline-suppressions
