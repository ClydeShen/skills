name: Skill security report

# Runs when third-party or authored skill content changes. Findings need human review:
# the scanner is best effort, so a clean result is not proof of safety and a finding is not a verdict.
on:
  pull_request:
    paths:
      - skills-lock.json
      - .agents/skills/**
      - incubator/*/candidate/**
      - skills/**
      - harness/skill-security*
      - .github/workflows/skill-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Scan each skill package
        run: |
          status=0
          for skill in incubator/*/candidate/* skills/* .agents/skills/*; do
            [ -f "$skill/SKILL.md" ] || continue
            node harness/skill-security.mjs "$skill" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-security-reports
          path: evals/.local/security/
          if-no-files-found: warn
