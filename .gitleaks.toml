title = "Repository secret scan"

[extend]
useDefault = true

[allowlist]
description = "Generated diagrams and icon catalogs contain encoded image data and public upstream commit IDs, not credentials."
paths = ['''\.drawio$''', '''\.svg$''', '''assets/catalog\.json$''', '''assets/vendor-icons\.json$''', '''prototype/catalog\.json$''']
regexes = ['''aws4-[0-9a-f]{16}''']
